<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrowserIP</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <header class="header">
      <div>
        <p class="eyebrow" data-i18n="popupEyebrow"></p>
        <h1 data-i18n="popupHeading"></h1>
      </div>
      <div class="header-links">
        <button id="openHistory" class="icon-button" type="button" data-i18n-attr="aria-label:historyTitle,title:historyTitle">&#128339;</button>
        <button id="openOptions" class="icon-button" type="button" data-i18n-attr="aria-label:settingsTitle,title:settingsTitle">&#9881;</button>
      </div>
    </header>
    <div id="vpnWarning" class="vpn-warning" role="alert" hidden></div>
    <section id="mullvadPanel" class="mullvad-panel" hidden>
      <div class="mullvad-head">
        <span class="mullvad-title" data-i18n="mullvadTitle"></span>
        <span id="mullvadState" class="mullvad-state" aria-live="polite"></span>
      </div>
      <div id="mullvadControls" class="mullvad-controls" hidden>
        <button id="mullvadToggle" type="button"></button>
        <button id="mullvadReconnect" type="button" class="secondary" data-i18n="mullvadReconnect"></button>
        <select id="mullvadCountry" data-i18n-attr="aria-label:mullvadChooseCountry"></select>
      </div>
      <button id="mullvadSetup" type="button" class="link-button" data-i18n="mullvadSetup" hidden></button>
    </section>
    <p class="ip-label"><span data-i18n="ipLabel"></span> <span class="hint" data-i18n="ipHint"></span></p>
    <button id="ip" class="ip" type="button" data-i18n-attr="title:copyIpTitle"></button>
    <dl class="details">
      <div class="row">
        <dt data-i18n="labelVpn"></dt>
        <dd>
          <span id="vpnStatus"></span>
          <span id="vpnDetail" class="sub" hidden></span>
        </dd>
      </div>
      <div class="row" id="ipv4Row" hidden>
        <dt>IPv4</dt>
        <dd id="ipv4"></dd>
      </div>
      <div class="row" id="ipv6Row" hidden>
        <dt>IPv6</dt>
        <dd id="ipv6"></dd>
      </div>
      <div class="row">
        <dt data-i18n="labelLocation"></dt>
        <dd id="location"></dd>
      </div>
      <div class="row">
        <dt data-i18n="labelCountry"></dt>
        <dd id="country"></dd>
      </div>
      <div class="row">
        <dt data-i18n="labelProvider"></dt>
        <dd id="provider"></dd>
      </div>
      <div class="row">
        <dt data-i18n="labelAsn"></dt>
        <dd id="asn"></dd>
      </div>
      <div class="row">
        <dt data-i18n="labelTimezone"></dt>
        <dd id="timezone"></dd>
      </div>
      <div class="row">
        <dt data-i18n="labelSource"></dt>
        <dd id="source"></dd>
      </div>
      <div class="row" id="reputationRow" hidden>
        <dt data-i18n="labelReputation"></dt>
        <dd id="reputation"></dd>
      </div>
    </dl>
    <p id="status" class="status" aria-live="polite"></p>
    <div class="actions">
      <button id="refresh" type="button" data-i18n="refresh"></button>
      <button id="copyReport" type="button" class="secondary" data-i18n="copyReport"></button>
    </div>
    <details class="tools" id="tools">
      <summary data-i18n="toolsHeading"></summary>
      <div class="tools-body">
        <div class="actions">
          <button id="webrtcTest" type="button" class="secondary" data-i18n="webrtcTest"></button>
          <button id="dnsTest" type="button" class="secondary" data-i18n="dnsTest"></button>
        </div>
        <p id="webrtcResult" class="result" aria-live="polite" hidden></p>
        <p id="dnsResult" class="result" aria-live="polite" hidden></p>
        <form id="lookupForm" class="lookup-form">
          <input id="lookupInput" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:lookupPlaceholder,aria-label:lookupPlaceholder">
          <button type="submit" data-i18n="lookupButton"></button>
        </form>
        <div id="lookupResult" aria-live="polite"></div>
      </div>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
