<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrowserIP</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <header class="header">
      <div>
        <p class="eyebrow">NETWORK INTEL</p>
        <h1>Public IP Trace</h1>
      </div>
      <button id="openOptions" class="icon-button" type="button" aria-label="Settings" title="Settings">&#9881;</button>
    </header>
    <div id="vpnWarning" class="vpn-warning" role="alert" hidden></div>
    <p class="ip-label">Browser egress IP <span class="hint">(click to copy)</span></p>
    <button id="ip" class="ip" type="button" title="Copy IP address">Loading...</button>
    <dl class="details">
      <div class="row">
        <dt>VPN</dt>
        <dd>
          <span id="vpnStatus">Checking...</span>
          <span id="vpnDetail" class="sub" hidden></span>
        </dd>
      </div>
      <div class="row" id="ipv4Row" hidden>
        <dt>IPV4</dt>
        <dd id="ipv4"></dd>
      </div>
      <div class="row" id="ipv6Row" hidden>
        <dt>IPV6</dt>
        <dd id="ipv6"></dd>
      </div>
      <div class="row">
        <dt>LOCATION</dt>
        <dd id="location">Loading...</dd>
      </div>
      <div class="row">
        <dt>COUNTRY</dt>
        <dd id="country">Loading...</dd>
      </div>
      <div class="row">
        <dt>PROVIDER</dt>
        <dd id="provider">Loading...</dd>
      </div>
      <div class="row">
        <dt>ASN</dt>
        <dd id="asn">Loading...</dd>
      </div>
      <div class="row">
        <dt>TIME ZONE</dt>
        <dd id="timezone">Loading...</dd>
      </div>
      <div class="row">
        <dt>SOURCE</dt>
        <dd id="source">Loading...</dd>
      </div>
    </dl>
    <p id="status" class="status" aria-live="polite"></p>
    <div class="actions">
      <button id="refresh" type="button">Refresh</button>
      <button id="webrtcTest" type="button" class="secondary">WebRTC leak test</button>
    </div>
    <p id="webrtcResult" class="webrtc-result" aria-live="polite" hidden></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
