<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrowserIP</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main class="panel">
    <p class="eyebrow">BROWSERIP</p>
    <h1 data-i18n="selftestTitle"></h1>
    <p class="note" data-i18n="selftestHelp"></p>
    <div class="toolbar">
      <button id="run" type="button" data-i18n="selftestRun"></button>
      <button id="copy" type="button" data-i18n="selftestCopy" disabled></button>
    </div>
    <p class="note" data-i18n="selftestPrivacy"></p>
    <ol id="results" class="selftest-list"></ol>
    <p id="status" class="status-line" aria-live="polite"></p>
  </main>
  <script type="module" src="selftest.js"></script>
</body>
</html>
